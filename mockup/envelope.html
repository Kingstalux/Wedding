<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Invitation — Bride &amp; Groom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&amp;family=Jost:wght@300;400;500&amp;family=Pinyon+Script&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
  body { background: var(--primary); color: var(--ivory); min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .card {
    width: min(560px, 100%); text-align: center; padding: clamp(48px, 8vw, 80px) clamp(24px, 6vw, 64px);
    border: 1px solid var(--line-dark); position: relative;
  }
  .card::before { content: ""; position: absolute; inset: 10px; border: 1px solid rgba(184, 145, 47, .45); pointer-events: none; }
  .monogram { font-family: var(--font-display); font-size: 44px; letter-spacing: .12em; display: inline-flex; align-items: center; gap: 16px; }
  .monogram i { display: inline-block; width: 1px; height: 44px; background: var(--gold); }
  .dear { font-family: var(--font-script); font-size: 40px; color: var(--ivory); margin: 32px 0 8px; line-height: 1.2; }
  h1 { font-size: clamp(30px, 5vw, 42px); text-transform: uppercase; letter-spacing: .04em; }
  h1 em { text-transform: none; font-size: .6em; display: block; margin: 6px 0; }
  .meta { font-size: 12px; letter-spacing: .24em; text-transform: uppercase; color: var(--on-dark-soft); line-height: 2.1; }
  .hint { font-size: 12px; color: var(--on-dark-soft); margin-top: 18px; letter-spacing: .06em; }
  .lang { position: fixed; top: 20px; right: 20px; display: inline-flex; border: 1px solid var(--line-dark); }
  .lang button { background: none; border: 0; color: var(--on-dark-soft); min-width: 44px; min-height: 40px; font-size: 11px; font-weight: 500; letter-spacing: .16em; cursor: pointer; }
  .lang button[aria-pressed="true"] { background: var(--ivory); color: var(--ink); }
</style>
</head>
<body>
<div class="lang" role="group" aria-label="Language">
  <button type="button" aria-pressed="true">EN</button>
  <button type="button" aria-pressed="false">FR</button>
</div>

<main class="card">
  <div class="monogram" aria-hidden="true">B<i></i>G</div>
  <p class="dear">Dear Guest Name</p>
  <p class="eyebrow light">You are warmly invited to the wedding of</p>
  <h1 class="display">Bride <em>and</em> Groom</h1>
  <hr class="rule center">
  <p class="meta">23 &amp; 26 December 2026<br>Yaoundé, Cameroon</p>
  <div style="margin-top: 36px;">
    <a class="btn gold" href="home.html">Open your invitation</a>
  </div>
  <p class="hint">♪ Music will play — “The Best Part of You”, Savvy</p>
</main>

<nav class="mock-bar" aria-label="Mockup pages"><a href="index.html">← All mockup pages</a></nav>
</body>
</html>
